<header class="header">
  <div class="header-top">
    <a routerLink="/" class="logo">
      🌼 BH<span>Shop</span>
    </a>
    <a routerLink="/cart" class="cart" aria-label="Giỏ hàng">
      🛒
      @if (cartService.totalCount() > 0) {
        <span class="cart-badge">{{ cartService.totalCount() }}</span>
      }
    </a>
  </div>

  <form class="search" (submit)="onSearchSubmit($event)">
    <input
      type="search"
      placeholder="Tìm bó hoa bạn yêu thích (VD: Hồng, Pastel...)"
      [value]="searchKeyword()"
      (input)="onSearchInput($event)">
    <button type="submit" class="search-btn" aria-label="Tìm kiếm">🔍</button>
  </form>
</header>

<nav class="nav">
  <a
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">
    Trang chủ
  </a>

  <a
    routerLink="/products"
    routerLinkActive="active">
    Sản phẩm
  </a>

  <a
    routerLink="/bai_viet"
    routerLinkActive="active">
    Bài viết
  </a>

  <a
    routerLink="/cart"
    routerLinkActive="active">
    Giỏ hàng ({{ cartService.totalCount() }})
  </a>
</nav>

@if (cartService.toastMessage()) {
  <div class="toast-banner">✅ {{ cartService.toastMessage() }}</div>
}
